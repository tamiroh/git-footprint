name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
      - run: make check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
      - run: make test

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
      - run: >-
          go run . --no-color --no-pager --fail-on info
          --allow-identity 'tamiroh <tamiroh71@gmail.com>'
          --allow-identity 'GitHub <noreply@github.com>'
          --allow-identity 'dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>'
          --allow-identity 'dependabot[bot] <support@github.com>'
